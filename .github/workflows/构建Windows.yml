name: 构建安安桌面版
on:
  push:
    branches: [main, desktop-implementation]
  workflow_dispatch:
env:
  PYTHONUTF8: '1'
permissions:
  contents: write
concurrency:
  group: anan-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Windows x64 测试和打包
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: 安装固定依赖
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: 运行测试
        run: python -m pytest -q
      - name: 打包并验证启动
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/构建.py
      - name: 上传 Windows 成品
        uses: actions/upload-artifact@v4
        with:
          name: 安安-Windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          retention-days: 30
      - name: 更新最新版下载
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem dist -Filter *.zip | ForEach-Object { $_.FullName })
          $assets += (Resolve-Path dist/SHA256SUMS.txt).Path
          $tag = "desktop-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT"
          gh release create $tag @assets --target $env:GITHUB_SHA --latest --title '安安 Windows 桌面版最新版' --notes "源码提交：$env:GITHUB_SHA。成品版本.json 可用于核对。"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 验证发布附件下载与启动
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/验证发布附件.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
